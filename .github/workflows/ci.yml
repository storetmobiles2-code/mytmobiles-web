# Quality gates for every pull request and for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myt
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mytmobiles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://myt:ci_password@localhost:5432/mytmobiles
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      ADMIN_EMAIL: admin@ci.example.com
      ADMIN_PASSWORD: CiAdminPass!2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database (throwaway, seeded from the stock sheet)
        run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Product files
        run: npm run catalog -- validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
