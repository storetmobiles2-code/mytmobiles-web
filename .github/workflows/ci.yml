# Quality gates for every pull request and for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets in the full git history (gitleaks) and known vulnerabilities in dependencies (Trivy).
  # Pinned CLI images: the gitleaks GitHub Action needs a paid licence on organisation repositories.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Dependencies, critical (Trivy, fails the build)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.1 fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet /repo
      - name: Dependencies, high (Trivy, report only)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.1 fs --scanners vuln --severity HIGH --ignore-unfixed --exit-code 0 --quiet /repo

  checks:
    # Pinned: Playwright 1.56 cannot install Chromium on ubuntu-latest (Ubuntu 26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myt
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: mytmobiles
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://myt:ci_password@localhost:5432/mytmobiles
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      # Test-only bearer secrets for the POS sync and approval-bot endpoints (tests/e2e/pos-sync.spec.ts)
      POS_SYNC_SECRET: ci-pos-sync-secret-0123456789abcdef01
      HARNESS_SECRET: ci-harness-secret-0123456789abcdef012
      ADMIN_EMAIL: admin@ci.example.com
      ADMIN_PASSWORD: CiAdminPass!2026
      # Test-only key for admin two-factor secrets in the throwaway CI database
      TOTP_ENCRYPTION_KEY: "SWfHsKmZrILcXM8UDHTWYvYSwbCIEF9dCQxqBkAUcHI="
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database (throwaway, seeded from the stock sheet)
        run: npx prisma migrate deploy && npx prisma db seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Product files
        run: npm run catalog -- validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
